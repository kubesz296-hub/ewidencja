<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a4d8f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ewidencja czasu pracy</title>
<style>
:root{--blue:#1a4d8f;--blue2:#e3ecf8;--bg:#f2f2ee;--text:#111;--muted:#4a4a4a;--red:#b3001b;--green:#16641b;--we:#fff4d9;--hol:#ffe3e3}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;font-family:Roboto,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:10px 10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav button{min-width:64px;min-height:58px;font-size:1.5rem;background:#fff;color:var(--blue);border:none;border-radius:14px;font-weight:700}
.mtitle{flex:1;text-align:center;font-size:1.35rem;font-weight:700}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.summary div{background:rgba(255,255,255,.16);border-radius:12px;padding:6px 4px;text-align:center;font-size:.85rem}
.summary b{display:block;font-size:1.3rem}
.summary .neg b{color:#ffb3b3}
.todaybtn{display:block;width:100%;margin-top:8px;min-height:48px;border:2px solid #fff;background:transparent;color:#fff;border-radius:12px;font-weight:700}
main{padding:6px 0 120px}
main.pad{padding:12px 12px 150px}
.day{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:8px;padding:10px 12px;min-height:70px;background:#fff;border:2px solid #d0d0d0;border-radius:14px;text-align:left;cursor:pointer}
.day.we{background:var(--we)}
.day.hol{background:var(--hol)}
.day.today{border:4px solid var(--blue)}
.day.miss{border-left:10px solid var(--red)}
.dnum{width:52px;text-align:center;flex:none}
.dnum b{display:block;font-size:1.6rem;line-height:1.1}
.dnum span{font-size:.9rem;color:var(--muted);font-weight:700}
.dmid{flex:1;min-width:0;font-size:.95rem}
.dmid .pl{color:var(--muted)}
.dright{text-align:right;flex:none}
.dright b{display:block;font-size:1.2rem}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.hname{color:var(--red);font-weight:700}
.warn{color:var(--red);font-weight:700}
.muted{color:var(--muted)}
.note{color:#7a4a00;font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;color:#fff;font-weight:700;font-size:.9rem;margin:2px 0}
.b-urlop{background:#1565c0}.b-l4{background:#6a1b9a}.b-wolny{background:#455a64}.b-wolneZaSwieto{background:#00796b}.b-swieto{background:#c62828}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid #ccc;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
footer.bar .btn{margin:0}
.btn{display:block;width:100%;min-height:60px;padding:10px 12px;margin:10px 0;font-size:1.1rem;font-weight:700;border-radius:14px;border:3px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--blue)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.green{background:var(--green);border-color:var(--green)}
.banner{margin:8px;padding:12px;border-radius:14px;background:#fff3c4;border:3px solid #e0a800}
.banner.red{background:#ffe3e3;border-color:var(--red)}
.banner.blue{background:var(--blue2);border-color:var(--blue)}
.banner p{margin:0 0 6px;font-weight:700}
.banner .btn{margin:6px 0 0}
header.simple{display:flex;align-items:center;gap:10px}
header.simple .back{min-height:56px;padding:0 14px;border:none;border-radius:12px;background:#fff;color:var(--blue);font-weight:700;font-size:1.05rem;flex:none}
header.simple .ttl{font-size:1.15rem;font-weight:700}
h2{font-size:1.2rem;margin:18px 0 8px}
.info{padding:10px 12px;border-radius:12px;background:var(--blue2);margin:8px 0;font-weight:700}
.info.red{background:var(--hol);color:var(--red)}
.info.yel{background:#fff3c4;color:#5a3c00}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mark{min-height:58px;border-radius:14px;border:3px solid #999;background:#fff;font-weight:700;font-size:1.05rem}
.mark.on{border-color:var(--blue);background:var(--blue);color:#fff}
.entry{background:#fff;border:2px solid #ccc;border-radius:14px;padding:12px;margin:12px 0}
.entry-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.1rem}
.entry-h button{min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--red);background:#fff;color:var(--red);font-weight:700}
label.lbl{display:block;font-weight:700;margin:12px 0 4px}
input.time{display:block;width:100%;font-size:2.1rem;font-weight:700;text-align:center;min-height:70px;border:3px solid var(--blue);border-radius:14px;background:#fff}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.steps button{min-height:56px;border-radius:12px;border:2px solid var(--blue);background:var(--blue2);color:var(--blue);font-weight:700;font-size:.9rem;padding:0 2px}
input.txt,select.txt,textarea.txt{resize:none;display:block;width:100%;min-height:60px;font-size:1.1rem;padding:8px 12px;border:3px solid #888;border-radius:14px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{min-height:52px;padding:6px 14px;border-radius:26px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chips button.on{background:var(--blue);color:#fff}
.dur{margin-top:10px;font-weight:700}
.daysum{font-size:1.15rem;font-weight:700;padding:12px;border-radius:14px;background:#fff;border:2px solid #ccc;margin:12px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{min-width:70px;min-height:64px;font-size:1.8rem;font-weight:700;border-radius:14px;border:3px solid var(--blue);background:var(--blue2);color:var(--blue)}
.stepper .val{flex:1;text-align:center;font-size:1.8rem;font-weight:700}
.card{background:#fff;border:2px solid #ccc;border-radius:14px;padding:12px;margin:12px 0}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.plrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ddd}
.plrow span{flex:1;font-weight:700;word-break:break-word}
.plrow button{min-height:48px;padding:0 10px;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;font-size:.9rem}
.plrow button.del{border-color:var(--red);color:var(--red)}
ul.hist{padding-left:22px;margin:6px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
.modal p{font-size:1.05rem}
.help p,.help li{font-size:1.02rem}
.help li{margin-bottom:6px}
.small{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<input type="file" id="importFile" accept=".txt,.json,text/plain,application/json" style="display:none">
<script>
'use strict';
/* ====== Stałe ====== */
const MONTHS=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const DAYS_FULL=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const DAYS_SHORT=['Nd','Pn','Wt','Śr','Cz','Pt','So'];
const MARKS={urlop:'Urlop',l4:'L4',wolny:'Dzień wolny',wolneZaSwieto:'Wolne za święto',swieto:'Święto'};
const NORM=480; // 8 godzin w minutach

/* ====== Pomocnicze ====== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function todayStr(){return ymd(new Date());}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function ymKey(y,m){return y+'-'+pad(m+1);}
function fmtDate(s){const d=parseYmd(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}
function fmtDateLong(s){const d=parseYmd(s);return DAYS_SHORT[d.getDay()]+' '+d.getDate()+' '+MONTHS_GEN[d.getMonth()]+' '+d.getFullYear();}
function daysBetween(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
function dni(n){return (Math.abs(n)===1?n+' dzień':n+' dni');}

/* ====== Święta w Polsce ====== */
const holCache={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function holidays(y){
  if(holCache[y])return holCache[y];
  const h={};const add=(m,d,n)=>{h[y+'-'+pad(m)+'-'+pad(d)]=n;};
  const e=easter(y);const addE=(o,n)=>{const d=new Date(e);d.setDate(d.getDate()+o);h[ymd(d)]=n;};
  add(1,1,'Nowy Rok');add(1,6,'Trzech Króli');addE(0,'Wielkanoc');addE(1,'Poniedziałek Wielkanocny');
  add(5,1,'Święto Pracy');add(5,3,'Święto Konstytucji 3 Maja');addE(49,'Zielone Świątki');addE(60,'Boże Ciało');
  add(8,15,'Wniebowzięcie NMP');add(11,1,'Wszystkich Świętych');add(11,11,'Święto Niepodległości');
  if(y>=2025)add(12,24,'Wigilia');add(12,25,'Boże Narodzenie');add(12,26,'Drugi dzień Bożego Narodzenia');
  return holCache[y]=h;
}
function holidayName(s){return holidays(+s.slice(0,4))[s]||null;}
function wday(s){return parseYmd(s).getDay();}
function isWeekend(s){const w=wday(s);return w===0||w===6;}
function isWorkdayNoMark(s){return !isWeekend(s)&&!holidayName(s);}
function satHolidays(y){return Object.keys(holidays(y)).filter(s=>wday(s)===6).sort();}

/* ====== Czas ====== */
function toMin(t){const [h,m]=String(t).split(':').map(Number);return (h||0)*60+(m||0);}
function fromMin(n){n=((n%1440)+1440)%1440;return pad(Math.floor(n/60))+':'+pad(n%60);}
function entryMin(e){let d=toMin(e.end)-toMin(e.start);if(d<0)d+=1440;return d;}
function fmtH(min){min=Math.abs(min);return Math.floor(min/60)+':'+pad(min%60);}
function fmtSigned(min){if(!min)return '0:00';return (min>0?'+':'−')+fmtH(min);}

/* ====== Stan ====== */
let S=null;
function defaultState(){const y=new Date().getFullYear();return{v:1,setupDone:false,name:'',places:[],days:{},
  vac:{base:0,baseDate:todayStr(),annual:26,lastYear:y,additions:[],history:[]},
  reminder:'15:30',sent:{},lastBackup:null,backupSnooze:null,lastTimes:{start:'07:00',end:'15:00'}};}
function migrate(st){const d=defaultState();const o=Object.assign(d,st||{});o.vac=Object.assign(defaultState().vac,o.vac||{});o.days=o.days||{};o.places=o.places||[];o.sent=o.sent||{};o.lastTimes=o.lastTimes||{start:'07:00',end:'15:00'};return o;}

/* ====== Zapis w telefonie (IndexedDB + kopia w localStorage) ====== */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('ewidencja',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  get(k){return new Promise((res,rej)=>{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}};
async function loadState(){
  let st=null;
  try{await DB.open();st=await DB.get('state');}catch(e){DB.db=null;}
  if(!st){try{const ls=localStorage.getItem('ewidencja');if(ls)st=JSON.parse(ls);}catch(e){}}
  return st?migrate(st):defaultState();
}
async function save(){
  const json=JSON.stringify(S);
  try{if(DB.db)await DB.set('state',JSON.parse(json));}catch(e){}
  try{localStorage.setItem('ewidencja',json);}catch(e){}
}

/* ====== Obliczenia ====== */
function dayCalcFrom(s,d){
  d=d||{};const entries=d.mark?[]:(d.entries||[]);const mark=d.mark||null;
  const worked=entries.reduce((a,e)=>a+entryMin(e),0);
  const hol=holidayName(s);const we=isWeekend(s);
  let over=0,deficit=0,missing=false;
  if(we||hol||mark){over=worked;}
  else if(worked===0){missing=s<todayStr();}
  else if(worked>NORM)over=worked-NORM;else deficit=NORM-worked;
  return{worked,over,deficit,net:over-deficit,mark,hol,we,missing,entries};
}
function dayCalc(s){return dayCalcFrom(s,S.days[s]);}
function monthCalc(y,m){
  const r={worked:0,over:0,deficit:0,net:0,urlop:0,l4:0,wolny:0,wzs:0,missing:0};
  for(let d=1;d<=daysInMonth(y,m);d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d);const c=dayCalc(s);
    r.worked+=c.worked;r.over+=c.over;r.deficit+=c.deficit;r.net+=c.net;
    if(c.missing)r.missing++;
    if(c.mark==='urlop'&&isWorkdayNoMark(s))r.urlop++;
    if(c.mark==='l4')r.l4++;if(c.mark==='wolny')r.wolny++;if(c.mark==='wolneZaSwieto')r.wzs++;
  }
  return r;
}
function isVacDay(s){const d=S.days[s];return !!(d&&d.mark==='urlop'&&isWorkdayNoMark(s));}
function vacBalance(at){
  at=at||'9999-12-31';const v=S.vac;let b=v.base;
  for(const a of v.additions)if(a.year+'-01-01'<=at)b+=a.days;
  for(const s in S.days)if(s>=v.baseDate&&s<=at&&isVacDay(s))b--;
  return b;
}
function yearlyAdd(){
  const y=new Date().getFullYear();const added=[];
  while(S.vac.lastYear<y){S.vac.lastYear++;const n=S.vac.annual;S.vac.additions.push({year:S.vac.lastYear,days:n});
    S.vac.history.push({date:S.vac.lastYear+'-01-01',text:'Dodano '+dni(n)+' urlopu na rok '+S.vac.lastYear});added.push(S.vac.lastYear);}
  return added;
}
function compFor(hs){for(const s in S.days){const d=S.days[s];if(d.mark==='wolneZaSwieto'&&d.forHoliday===hs)return s;}return null;}
function hasMonthData(y,m){const p=ymKey(y,m);return Object.keys(S.days).some(s=>s.startsWith(p));}

/* ====== Widok ====== */
const now0=new Date();
const V={screen:'main',y:now0.getFullYear(),m:now0.getMonth(),day:null,draft:null,setup:null,vacEdit:null,scrollToday:true,compPick:false};
let installPrompt=null;

function render(){
  const app=$('#app');
  if(!S.setupDone){app.innerHTML=renderSetup();return;}
  if(V.screen==='day')app.innerHTML=renderDay();
  else if(V.screen==='settings')app.innerHTML=renderSettings();
  else if(V.screen==='help')app.innerHTML=renderHelp();
  else app.innerHTML=renderMain();
}
function go(screen){V.screen=screen;render();window.scrollTo(0,0);}

/* --- Pierwsze uruchomienie --- */
function renderSetup(){
  if(!V.setup)V.setup={name:'',vac:0,annual:26};const st=V.setup;
  return `<header class="top simple"><div class="ttl">Ewidencja czasu pracy</div></header><main class="pad">
  <h2>Witaj! Uzupełnij kilka informacji</h2>
  <label class="lbl" for="sName">Imię i nazwisko</label>
  <input class="txt" id="sName" data-f="setupName" value="${esc(st.name)}" placeholder="np. Jan Kowalski" autocomplete="name">
  <label class="lbl">Ile dni urlopu masz teraz do wykorzystania?</label>
  <div class="small">Razem z zaległym urlopem z poprzednich lat.</div>
  <div class="stepper"><button data-act="setupStep" data-k="vac" data-n="-1">−</button><div class="val">${dni(st.vac)}</div><button data-act="setupStep" data-k="vac" data-n="1">+</button></div>
  <div class="row2"><button class="btn sec" data-act="setupStep" data-k="vac" data-n="-5">−5</button><button class="btn sec" data-act="setupStep" data-k="vac" data-n="5">+5</button></div>
  <label class="lbl">Ile dni urlopu przysługuje Ci w roku?</label>
  <div class="stepper"><button data-act="setupStep" data-k="annual" data-n="-1">−</button><div class="val">${dni(st.annual)}</div><button data-act="setupStep" data-k="annual" data-n="1">+</button></div>
  <div class="row2"><button class="btn sec" data-act="setupSet" data-k="annual" data-n="20">20 dni</button><button class="btn sec" data-act="setupSet" data-k="annual" data-n="26">26 dni</button></div>
  <div class="small">Te dni zostaną dodane do puli każdego 1 stycznia.</div>
  <button class="btn green" data-act="setupDone">Zaczynamy</button>
  </main>`;
}

/* --- Ekran główny --- */
function renderMain(){
  const {y,m}=V;const mc=monthCalc(y,m);const bal=vacBalance();const t=todayStr();
  const isCur=(y===new Date().getFullYear()&&m===new Date().getMonth());
  let h=`<header class="top"><div class="monthnav"><button data-act="month" data-n="-1" aria-label="Poprzedni miesiąc">◀</button><div class="mtitle">${cap(MONTHS[m])} ${y}</div><button data-act="month" data-n="1" aria-label="Następny miesiąc">▶</button></div>
  <div class="summary"><div>Godziny<b>${fmtH(mc.worked)}</b></div><div class="${mc.net<0?'neg':''}">Nadgodziny<b>${fmtSigned(mc.net)}</b></div><div class="${bal<0?'neg':''}">Urlop zostało<b>${dni(bal)}</b></div></div>
  ${isCur?'':'<button class="todaybtn" data-act="toToday">Wróć do bieżącego miesiąca</button>'}</header><main><div id="banners">${renderBanners()}</div>`;
  if(mc.missing)h+=`<div class="banner red"><p>Brakuje wpisów w ${dni(mc.missing)} roboczych tego miesiąca (zaznaczone czerwonym paskiem).</p></div>`;
  for(let d=1;d<=daysInMonth(y,m);d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d);const c=dayCalc(s);const dd=S.days[s]||{};
    let cls='day';if(c.hol||c.mark==='swieto')cls+=' hol';else if(c.we)cls+=' we';if(s===t)cls+=' today';if(c.missing)cls+=' miss';
    let mid='';
    if(c.hol)mid+=`<div class="hname">${esc(c.hol)}</div>`;
    if(c.mark)mid+=`<span class="badge b-${c.mark}">${MARKS[c.mark]}</span>`;
    if(c.mark==='wolneZaSwieto'&&dd.forHoliday)mid+=` <span class="muted">za ${fmtDate(dd.forHoliday)}</span>`;
    for(const e of c.entries)mid+=`<div>${e.start}–${e.end} <span class="pl">${esc(e.place)||'—'}</span></div>`;
    if(c.hol&&wday(s)===6){const cp=compFor(s);mid+=`<div class="note">${cp?'Wolne za to święto: '+fmtDate(cp):'Przysługuje dzień wolny – dotknij, aby wybrać'}</div>`;}
    if(c.missing)mid+=`<div class="warn">Brak wpisu</div>`;
    else if(s===t&&!c.entries.length&&!c.mark)mid+=`<div class="muted">Dotknij, aby wpisać godziny</div>`;
    let right='';
    if(c.worked)right+=`<b>${fmtH(c.worked)}</b>`;
    if(c.net)right+=`<span class="${c.net>0?'pos':'neg'}">${fmtSigned(c.net)}</span>`;

/* --- Edycja dnia --- */
function openDay(s){
  const d=S.days[s];
  V.draft=d?JSON.parse(JSON.stringify(d)):{entries:[],mark:null};
  if(!V.draft.entries)V.draft.entries=[];
  if(!V.draft.mark&&!V.draft.entries.length&&isWorkdayNoMark(s))V.draft.entries.push(newEntry());
  V.day=s;V.compPick=false;go('day');
}
function splitPlaces(t){return String(t||'').split('/').map(x=>x.trim()).filter(Boolean);}
function newEntry(){return{start:S.lastTimes.start||'07:00',end:S.lastTimes.end||'15:00',place:''};}

      <label class="lbl">Miejsce pracy</label><div class="small">Dotknij kilku miejsc z listy – dodadzą się po kolei. Dotknij ponownie, aby usunąć.</div><textarea class="txt" rows="2" data-f="place" data-i="${i}" placeholder="Wpisz lub wybierz poniżej">${esc(e.place)}</textarea>
      ${S.places.length?`<div class="chips">${S.places.map((p,pi)=>`<button class="${splitPlaces(e.place).some(x=>x.toLowerCase()===p.toLowerCase())?'on':''}" data-act="setPlace" data-i="${i}" data-p="${pi}">${esc(p)}</button>`).join('')}</div>`:''}
      ${e.place?`<button class="btn danger" style="min-height:52px" data-act="clearPlace" data-i="${i}">Wyczyść miejsce</button>`:''}

    else h+=`<button class="btn sec" data-act="addEntry">+ Dodaj kolejne miejsce pracy</button><button class="btn sec" data-act="likeYesterday">Wpisz tak jak ostatnio</button>`;
  }else if(dr.mark==='urlop'){
    const old=S.days[s]||{};
    if(!isWorkdayNoMark(s))h+=`<div class="info">Urlop w weekend lub święto nie zmniejsza puli dni urlopowych.</div>`;
    else if(s<S.vac.baseDate)h+=`<div class="info">Ten dzień jest sprzed ustawienia stanu urlopu, więc nie zmienia puli.</div>`;
    else{const b=vacBalance()-(old.mark==='urlop'?0:1);h+=`<div class="info ${b<0?'red':''}">Po zapisaniu zostanie Ci ${dni(b)} urlopu.</div>`;}
  }else if(dr.mark==='wolneZaSwieto'){

    h+=`<label class="lbl">Za które święto (w sobotę)?</label><select class="txt" data-f="forHoliday"><option value="">— nie wybrano —</option>${list.map(x=>{const cp=compFor(x);return `<option value="${x}" ${dr.forHoliday===x?'selected':''}>${fmtDate(x)} ${esc(holidayName(x))}${cp&&cp!==s?' (już oddane)':''}</option>`;}).join('')}</select>`;

  h+=`<div class="daysum">Razem: ${fmtH(c.worked)} godz.<br>Nadgodziny: <span class="${c.net>0?'pos':c.net<0?'neg':''}">${fmtSigned(c.net)}</span></div>`;
  h+=`<button class="btn green" data-act="saveDay">Zapisz</button><button class="btn sec" data-act="cancelDay">Anuluj</button>`;
  if(S.days[s])h+=`<button class="btn danger" data-act="clearDay">Usuń wpis z tego dnia</button>`;
  return h+`</main>`;
}
function satHolidayBox(s){
  const cp=compFor(s);

  h+=cp?`Wolne oddane: <b>${fmtDateLong(cp)}</b>`:'Nie wybrano jeszcze dnia wolnego.';
  h+=`</div>`;
  if(V.compPick)h+=`<label class="lbl">Wybierz dzień wolny za to święto</label><input type="date" class="txt" id="compDate" value="${cp||''}"><button class="btn" data-act="assignComp">Zatwierdź dzień wolny</button>`;

/* ====== Okienka ====== */
function dialog({title,text,input,buttons}){
  return new Promise(res=>{const root=$('#modal-root');
    root.innerHTML=`<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2>${text?`<p>${text}</p>`:''}${input!==undefined?`<input id="dlgIn" class="txt" value="${esc(input)}">`:''}${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-dlg="${i}">${esc(b.l)}</button>`).join('')}</div></div>`;
    const inp=$('#dlgIn');if(inp)setTimeout(()=>inp.focus(),50);
    root.onclick=e=>{const t=e.target.closest('[data-dlg]');if(!t)return;const b=buttons[+t.dataset.dlg];const v=inp?inp.value:null;root.innerHTML='';root.onclick=null;res({v:b.v,input:v});};});
}
const msg=(title,text)=>dialog({title,text,buttons:[{l:'OK',v:1}]});
const ask=(title,text,yes,no,danger)=>dialog({title,text,buttons:[{l:yes,v:1,cls:danger?'danger':'green'},{l:no||'Anuluj',v:0,cls:'sec'}]}).then(r=>!!r.v);

/* ====== Akcje ====== */
const A={
  go:t=>{if(t.dataset.s==='settings')V.vacEdit=null;go(t.dataset.s);if(t.dataset.s==='main')scrollToday();},
  setupStep:t=>{const k=t.dataset.k;V.setup[k]=Math.max(0,V.setup[k]+(+t.dataset.n));render();},
  setupSet:t=>{V.setup[t.dataset.k]=+t.dataset.n;render();},
  setupDone:async()=>{const st=V.setup;const name=st.name.trim();
    if(!name){await msg('Brak imienia','Wpisz imię i nazwisko – będzie na wydruku.');return;}
    S.name=name;S.vac.base=st.vac;S.vac.baseDate=todayStr();S.vac.annual=st.annual;S.vac.lastYear=new Date().getFullYear();
    S.vac.history.push({date:todayStr(),text:'Ustawiono stan urlopu: '+dni(st.vac)});S.setupDone=true;
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
    await save();V.screen='main';render();scrollToday();},
  month:t=>{let m=V.m+(+t.dataset.n),y=V.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}V.m=m;V.y=y;render();window.scrollTo(0,0);},
  toToday:()=>{const n=new Date();V.y=n.getFullYear();V.m=n.getMonth();render();scrollToday();},
  openDay:t=>openDay(t.dataset.d),
  cancelDay:()=>{const s=V.day;go('main');scrollTo(s);},
  setMark:t=>{const k=t.dataset.k||null;V.draft.mark=k;if(!k&&!V.draft.entries.length)V.draft.entries.push(newEntry());render();},
  t:t=>{const e=V.draft.entries[+t.dataset.i];const k=t.dataset.k;e[k]=fromMin(Math.round((toMin(e[k])+(+t.dataset.n))/15)*15);render();},
  addEntry:()=>{const last=V.draft.entries[V.draft.entries.length-1];V.draft.entries.push(last?{start:last.end,end:fromMin(toMin(last.end)+120),place:''}:newEntry());render();},
  delEntry:async t=>{if(await ask('Usunąć to miejsce?','Wpis zostanie usunięty z tego dnia.','Tak, usuń','Nie',true)){V.draft.entries.splice(+t.dataset.i,1);render();}},
  setPlace:t=>{const e=V.draft.entries[+t.dataset.i];const pl=S.places[+t.dataset.p];const parts=splitPlaces(e.place);
    const i=parts.findIndex(x=>x.toLowerCase()===pl.toLowerCase());if(i>=0)parts.splice(i,1);else parts.push(pl);e.place=parts.join(' / ');render();},
  clearPlace:t=>{V.draft.entries[+t.dataset.i].place='';render();},
  likeYesterday:async()=>{let s=V.day;for(let i=0;i<60;i++){s=addDays(s,-1);const d=S.days[s];if(d&&!d.mark&&d.entries&&d.entries.length){V.draft.entries=JSON.parse(JSON.stringify(d.entries));V.draft.mark=null;render();return;}}
    await msg('Brak wcześniejszego wpisu','Nie znalazłem wcześniejszego dnia z godzinami pracy.');},
  saveDay:async()=>{
    const s=V.day,dr=V.draft,old=S.days[s]||{};
    if(dr.mark)dr.entries=[];else dr.entries.forEach(e=>e.place=(e.place||'').trim());
    if(dr.mark==='urlop'&&old.mark!=='urlop'&&isWorkdayNoMark(s)&&s>=S.vac.baseDate&&vacBalance()<=0){
      if(!await ask('Brak dni urlopu','Nie masz już dni urlopu do wykorzystania. Zapisać urlop mimo to?','Tak, zapisz','Nie'))return;}
    if(!dr.mark&&!dr.entries.length)delete S.days[s];
    else{const o={entries:dr.entries,mark:dr.mark||null};if(dr.mark==='wolneZaSwieto'&&dr.forHoliday)o.forHoliday=dr.forHoliday;S.days[s]=o;}
    for(const e of dr.entries)for(const pl of splitPlaces(e.place))if(!S.places.some(x=>x.toLowerCase()===pl.toLowerCase()))S.places.push(pl);
    if(dr.entries.length)S.lastTimes={start:dr.entries[0].start,end:dr.entries[dr.entries.length-1].end};
    await save();go('main');scrollTo(s);},
  clearDay:async()=>{if(await ask('Usunąć wpis?','Wszystkie godziny i oznaczenia z tego dnia zostaną usunięte.','Tak, usuń','Nie',true)){delete S.days[V.day];await save();const s=V.day;go('main');scrollTo(s);}},
  compPick:()=>{V.compPick=true;render();},
  assignComp:async()=>{const v=($('#compDate')||{}).value;const hs=V.day;
    if(!v){await msg('Wybierz dzień','Wybierz datę dnia wolnego.');return;}
    if(!isWorkdayNoMark(v)){await msg('To nie jest dzień roboczy','Wybierz dzień od poniedziałku do piątku, który nie jest świętem.');return;}
    const tgt=S.days[v];
    if(tgt&&(tgt.mark&&tgt.mark!=='wolneZaSwieto'||(tgt.entries&&tgt.entries.length))){if(!await ask('Ten dzień ma już wpis','Zastąpić go dniem wolnym za święto?','Tak, zastąp','Nie'))return;}
    const prev=compFor(hs);if(prev&&prev!==v)delete S.days[prev];
    S.days[v]={entries:[],mark:'wolneZaSwieto',forHoliday:hs};V.compPick=false;await save();render();
    await msg('Zapisano',`Dzień wolny za święto ${fmtDate(hs)}: ${fmtDateLong(v)}.`);},
  sendPdf:t=>sendPdf(+t.dataset.y,+t.dataset.m),
  install:async()=>{if(!installPrompt)return;installPrompt.prompt();try{await installPrompt.userChoice;}catch(e){}installPrompt=null;refreshBanners();},
  snoozeBackup:async()=>{const n=new Date();S.backupSnooze=ymKey(n.getFullYear(),n.getMonth());await save();refreshBanners();},
  backup:()=>exportBackup(),
  restore:()=>{$('#importFile').value='';$('#importFile').click();},
  vacEdit:t=>{V.vacEdit+=(+t.dataset.n);render();},
  vacSave:async()=>{const v=V.vacEdit;if(!await ask('Zmienić stan urlopu?',`Od dziś będziesz mieć ${dni(v)} urlopu do wykorzystania.`,'Tak, zapisz','Nie'))return;
    S.vac.base=v;S.vac.baseDate=todayStr();S.vac.additions=[];S.vac.lastYear=new Date().getFullYear();
    // urlop zaznaczony od dziś w przyszłość nadal się odejmuje, więc doliczamy go do bazy, aby saldo wynosiło dokładnie v
    const future=Object.keys(S.days).filter(s=>s>=S.vac.baseDate&&isVacDay(s)).length;S.vac.base=v+future;
    S.vac.history.push({date:todayStr(),text:'Zmieniono stan urlopu na '+dni(v)});V.vacEdit=null;await save();render();},
  annual:async t=>{S.vac.annual=Math.max(0,S.vac.annual+(+t.dataset.n));await save();render();},
  annualSet:async t=>{S.vac.annual=+t.dataset.n;await save();render();},
  plAdd:async()=>{const r=await dialog({title:'Nowe miejsce pracy',input:'',buttons:[{l:'Dodaj',v:1,cls:'green'},{l:'Anuluj',v:0,cls:'sec'}]});const p=(r.input||'').trim();if(r.v&&p&&!S.places.includes(p)){S.places.push(p);await save();render();}},
  plRename:async t=>{const i=+t.dataset.i;const r=await dialog({title:'Zmień nazwę miejsca',input:S.places[i],buttons:[{l:'Zapisz',v:1,cls:'green'},{l:'Anuluj',v:0,cls:'sec'}]});const p=(r.input||'').trim();if(r.v&&p){S.places[i]=p;await save();render();}},
  plDel:async t=>{const i=+t.dataset.i;if(await ask('Usunąć miejsce z listy?',`„${esc(S.places[i])}” zniknie z listy podpowiedzi. Wpisane już godziny zostaną.`,'Tak, usuń','Nie',true)){S.places.splice(i,1);await save();render();}},
  gcal:()=>{const f=firstReminderDate();const d=f.replace(/-/g,'');const t=S.reminder.replace(':','')+'00';const t2=fromMin(toMin(S.reminder)+15).replace(':','')+'00';
    const url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Wyślij godziny pracy do kadr')+'&details='+encodeURIComponent('Otwórz aplikację Ewidencja i naciśnij „Wyślij PDF”.')+'&dates='+d+'T'+t+'/'+d+'T'+t2+'&ctz=Europe/Warsaw&recur='+encodeURIComponent('RRULE:FREQ=MONTHLY;BYMONTHDAY=-1');
    window.open(url,'_blank');},
  ics:()=>{const f=firstReminderDate().replace(/-/g,'');const t=S.reminder.replace(':','')+'00';const n=new Date();
    const stamp=n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+'T'+pad(n.getUTCHours())+pad(n.getUTCMinutes())+'00Z';
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ewidencja czasu pracy//PL','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:ewidencja-przypomnienie-'+Date.now()+'@telefon','DTSTAMP:'+stamp,'DTSTART:'+f+'T'+t,'DURATION:PT15M','RRULE:FREQ=MONTHLY;BYMONTHDAY=-1','SUMMARY:Wyślij godziny pracy do kadr','DESCRIPTION:Otwórz aplikację Ewidencja i naciśnij Wyślij PDF.','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Wyślij godziny pracy do kadr','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    download(new Blob([ics],{type:'text/calendar'}),'przypomnienie_ewidencja.ics');},
};
function firstReminderDate(){const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(daysInMonth(n.getFullYear(),n.getMonth()));}
function scrollTo(s){setTimeout(()=>{const el=document.getElementById('d-'+s);if(el)el.scrollIntoView({block:'center'});},30);}
function scrollToday(){const n=new Date();if(V.y===n.getFullYear()&&V.m===n.getMonth())scrollTo(todayStr());}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e);}});
document.addEventListener('input',e=>{const t=e.target;const f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='setupName')V.setup.name=t.value;
  else if(f==='place')V.draft.entries[+t.dataset.i].place=t.value;
  else if(f==='name'){S.name=t.value;save();}});
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='time'&&t.value){V.draft.entries[+t.dataset.i][t.dataset.k]=t.value;render();}
  else if(f==='forHoliday'){V.draft.forHoliday=t.value||null;}
  else if(f==='reminder'&&t.value){S.reminder=t.value;save();}
  else if(f==='name'){S.name=t.value.trim();save();}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;
  try{const o=JSON.parse(await file.text());const st=o.state||o;if(!st||typeof st.days!=='object')throw 0;
    if(!await ask('Wczytać kopię?',`Kopia z dnia ${o.exported?fmtDate(ymd(new Date(o.exported))):'?'} zastąpi wszystkie obecne dane w aplikacji.`,'Tak, wczytaj','Nie',true))return;
    S=migrate(st);S.setupDone=true;await save();V.vacEdit=null;render();await msg('Gotowe','Kopia została wczytana.');
  }catch(err){await msg('Błąd','To nie jest prawidłowy plik kopii zapasowej z tej aplikacji.');}});

/* ====== Pliki ====== */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
async function shareOrDownload(file){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:file.name});return 'shared';}catch(e){if(e&&e.name==='AbortError')return 'aborted';}
  }
  download(file,file.name);return 'downloaded';
}
function safeName(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').replace(/Ł/g,'L').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'Pracownik';}
async function exportBackup(){
  const data=JSON.stringify({app:'ewidencja-czasu-pracy',exported:new Date().toISOString(),state:S});
  const file=new File([data],'Ewidencja_kopia_'+safeName(S.name)+'_'+todayStr()+'.txt',{type:'text/plain'});
  const r=await shareOrDownload(file);
  if(r!=='aborted'){S.lastBackup=todayStr();await save();render();if(r==='downloaded')await msg('Kopia zapisana','Plik kopii jest w folderze „Pobrane”. Przechowuj go w bezpiecznym miejscu.');}
}
async function sendPdf(y,m){
  const bytes=buildPdf(y,m);
  const file=new File([bytes],'Ewidencja_'+safeName(S.name)+'_'+ymKey(y,m)+'.pdf',{type:'application/pdf'});
  const r=await shareOrDownload(file);
  if(r!=='aborted'){S.sent[ymKey(y,m)]=true;await save();refreshBanners();if(r==='downloaded')await msg('PDF zapisany','Plik jest w folderze „Pobrane”. Możesz go wysłać na WhatsApp jako dokument.');}
}

/* ====== PDF (rysowany na kartce A4, bez zewnętrznych bibliotek) ====== */
function drawSheet(y,m){
  const W=1654,H=2339,k=W/210;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const X=v=>v*k;const FF='Arial, Roboto, "Liberation Sans", Helvetica, sans-serif';
  const setF=(pt,b)=>{g.font=(b?'bold ':'')+(pt*0.3528*k).toFixed(1)+'px '+FF;};
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#000';g.strokeStyle='#000';g.textBaseline='middle';
  function txt(t,x,yc,maxW,pt,bold,align){t=String(t);setF(pt,bold);let p=pt;
    while(g.measureText(t).width>X(maxW)&&p>pt*0.72){p-=0.25;setF(p,bold);}
    if(g.measureText(t).width>X(maxW)){while(t.length>1&&g.measureText(t+'…').width>X(maxW))t=t.slice(0,-1);t+='…';}
    g.textAlign=align||'left';g.fillText(t,X(x),X(yc));}
  function line(x1,y1,x2,y2,w,col){g.beginPath();g.lineWidth=X(w);g.strokeStyle=col||'#000';g.moveTo(X(x1),X(y1));g.lineTo(X(x2),X(y2));g.stroke();}

  txt('EWIDENCJA CZASU PRACY',105,15,190,17,true,'center');
  setF(11,false);g.textAlign='left';g.fillText('Imię i nazwisko: ',X(10),X(25));let w1=g.measureText('Imię i nazwisko: ').width/k;
  txt(S.name,10+w1,25,105-w1,11,true);
  const mtxt=cap(MONTHS[m])+' '+y;setF(11,true);const w2=g.measureText(mtxt).width/k;txt(mtxt,200,25,60,11,true,'right');
  setF(11,false);g.textAlign='right';g.fillText('Miesiąc: ',X(200-w2),X(25));

  const cols=[['Dzień',10],['Dzień\ntyg.',11],['Miejsce pracy',52],['Godz.\nrozpocz.',16],['Godz.\nzakończ.',16],['Liczba\ngodzin',14],['Nadgo-\ndziny',15],['Uwagi',24],['Podpis\npracownika',32]];
  const cx=[10];cols.forEach(cc=>cx.push(cx[cx.length-1]+cc[1]));
  const top=31,hh=11;
  const rows=[];let lines=0;const nd=daysInMonth(y,m);
  for(let d=1;d<=nd;d++){const s=y+'-'+pad(m+1)+'-'+pad(d);const cc=dayCalc(s);const n=Math.max(1,cc.entries.length);rows.push({s,d,c:cc,n});lines+=n;}
  const avail=297-12-44-(top+hh);const lh=Math.min(8,avail/lines);const pt=Math.min(9.5,lh/0.3528*0.56);
  // nagłówek tabeli
  g.fillStyle='#d9d9d9';g.fillRect(X(10),X(top),X(190),X(hh));g.fillStyle='#000';
  cols.forEach((cc,i)=>{const parts=cc[0].split('\n');const mid=(cx[i]+cx[i+1])/2;
    parts.forEach((p,j)=>txt(p,mid,top+hh/2+(j-(parts.length-1)/2)*3.6,cc[1]-1.5,8,true,'center'));});
  let yy=top+hh;
  for(const r of rows){
    const rh=r.n*lh;const c=r.c;const dd=S.days[r.s]||{};
    if(c.we||c.hol||c.mark==='swieto'){g.fillStyle='#e8e8e8';g.fillRect(X(10),X(yy),X(190),X(rh));g.fillStyle='#000';}
    const midY=yy+rh/2;
    txt(String(r.d),(cx[0]+cx[1])/2,midY,cols[0][1]-1,pt,true,'center');
    txt(DAYS_SHORT[wday(r.s)],(cx[1]+cx[2])/2,midY,cols[1][1]-1,pt,false,'center');
    c.entries.forEach((e,i)=>{const ly=yy+i*lh+lh/2;
      txt(e.place||'',cx[2]+1.2,ly,cols[2][1]-2.4,pt,false,'left');
      txt(e.start,(cx[3]+cx[4])/2,ly,cols[3][1]-1,pt,false,'center');
      txt(e.end,(cx[4]+cx[5])/2,ly,cols[4][1]-1,pt,false,'center');
      if(i>0)[2,3,4].forEach(ci=>line(cx[ci],yy+i*lh,cx[ci+1],yy+i*lh,0.15,'#888'));});
    if(c.worked)txt(fmtH(c.worked),(cx[5]+cx[6])/2,midY,cols[5][1]-1,pt,true,'center');
    if(c.net)txt(fmtSigned(c.net),(cx[6]+cx[7])/2,midY,cols[6][1]-1,pt,true,'center');
    let u='';if(c.mark==='wolneZaSwieto'&&dd.forHoliday)u='Wolne za św. '+fmtDate(dd.forHoliday).slice(0,5);else if(c.mark)u=MARKS[c.mark];else if(c.hol)u='Święto';
    if(u)txt(u,(cx[7]+cx[8])/2,midY,cols[7][1]-1.5,pt*0.92,false,'center');
    yy+=rh;line(10,yy,200,yy,0.2);
  }
  // linie pionowe i ramka
  cx.forEach((x,i)=>line(x,top,x,yy,(i===0||i===cx.length-1)?0.45:0.2));
  line(10,top,200,top,0.45);line(10,top+hh,200,top+hh,0.3);line(10,yy,200,yy,0.45);

  // podsumowanie
  const mc=monthCalc(y,m);const me=y+'-'+pad(m+1)+'-'+pad(nd);
  const L=[['Suma godzin przepracowanych:',fmtH(mc.worked)],['Nadgodziny:',(mc.over?'+':'')+fmtH(mc.over)],['Niedobory (poniżej 8 godz.):',(mc.deficit?'−':'')+fmtH(mc.deficit)],['Saldo nadgodzin:',fmtSigned(mc.net)]];
  const R=[['Dni urlopu:',String(mc.urlop)],['Dni L4:',String(mc.l4)],['Dni wolne za święto:',String(mc.wzs)]];
  if(mc.wolny)R.push(['Dni wolne:',String(mc.wolny)]);
  if(me>=S.vac.baseDate)R.push(['Pozostało dni urlopu:',String(vacBalance(me))]);
  let sy=yy+7;
  L.forEach((a,i)=>{txt(a[0],10,sy+i*6,62,10.5,i===3);txt(a[1],95,sy+i*6,22,10.5,true,'right');});
  R.forEach((a,i)=>{txt(a[0],110,sy+i*6,62,10.5,false);txt(a[1],200,sy+i*6,20,10.5,true,'right');});
  sy+=Math.max(L.length,R.length)*6+3;
  txt('Nadgodziny: „+” – godziny ponad 8 godz. (pon.–pt.), „−” – brak do 8 godz. Soboty, niedziele i święta – wszystkie godziny jako nadgodziny.',10,sy,190,7.5,false);
  txt('Wygenerowano: '+fmtDate(todayStr()),10,290,90,7.5,false);
  return c;
}
function b64ToBytes(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function buildPdf(y,m){
  const c=drawSheet(y,m);const jpg=b64ToBytes(c.toDataURL('image/jpeg',0.92).split(',')[1]);
  const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n');};
  push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>'));
  const content='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n';
  obj(4,()=>push('<< /Length '+content.length+' >>\nstream\n'+content+'endstream'));
  obj(5,()=>{push('<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream');});
  obj(6,()=>push('<< /Title (Ewidencja czasu pracy '+ymKey(y,m)+') /Producer (Ewidencja czasu pracy) >>'));
  const xref=len;let x='xref\n0 7\n0000000000 65535 f \n';for(let i=1;i<=6;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length;}return out;
}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;refreshBanners();});
window.addEventListener('appinstalled',()=>{installPrompt=null;refreshBanners();});
setInterval(refreshBanners,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshBanners();});
(async()=>{
  S=await loadState();
  const added=S.setupDone?yearlyAdd():[];
  if(added.length)await save();
  render();scrollToday();
  if(added.length)await msg('Nowy rok – dodano urlop',`Dodano ${dni(S.vac.annual)} urlopu na rok ${added.join(', ')}. Masz teraz ${dni(vacBalance())} do wykorzystania.`);
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
